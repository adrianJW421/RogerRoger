name: Verify RogerRoger

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Web checks
        working-directory: web
        run: |
          npm ci
          npm test
          npm run typecheck
      - name: Android segmentation, readiness, stop and send checks
        run: |
          mkdir -p .local/ci-java
          javac --release 8 -encoding UTF-8 -d .local/ci-java \
            android/src/local/vibecast/mic/{FollowSegment,RecordingGate,StopDrain,SendQueue}.java \
            android/tests/*.java
          for test in FollowSegmentTest RecordingGateTest StopAndSendTest; do
            java -cp .local/ci-java "local.vibecast.mic.$test"
          done
      - name: Mac regressions without real input events
        run: |
          bash scripts/test_ax_range.sh
          bash scripts/test_focus_guard.sh
          bash scripts/test_packaged_resources.sh
      - name: Build and verify Mac preview
        env:
          VERSION: '0.4.0'
          BUILD_NUMBER: '10.7'
          SWIFT_ARCHS: arm64
        run: bash scripts/build_app.sh
